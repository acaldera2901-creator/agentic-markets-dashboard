<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetRedge · Sala Controllo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#08090C; --panel:#101319; --panel-2:#141821; --inset:#0C0E13;
  --line:#1E2430; --line-2:#2C3646; --text:#E8ECF2; --muted:#8994A5; --dim:#616C7E;
  --steel:#7FA8D8; --amber:#F0B434; --green:#2FBB68; --green-2:#7BE8A8;
  --red:#F0736D; --violet:#9B8CFF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── barra ── */
.bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 20px;background:rgba(8,9,12,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:-.01em;font-size:15px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}
.dot.unknown{background:var(--dim)}.dot.off{background:var(--line-2)}
.tabs{display:flex;gap:5px;margin-left:8px}
.tabs button{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;cursor:pointer;padding:6px 12px;border-radius:3px;
  border:1px solid var(--line-2);background:transparent;color:var(--muted);transition:.13s}
.tabs button:hover{color:var(--text);border-color:var(--steel)}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--text);border-color:var(--steel)}
.tabs button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.stamp{margin-left:auto;font-size:11px;color:var(--dim)}

/* ── verdetto ── */
.verdict{display:flex;align-items:baseline;gap:11px;padding:13px 20px;border-bottom:1px solid var(--line);
  background:var(--panel)}
.verdict b{font-size:14px}
.verdict span{color:var(--muted);font-size:12.5px}
.verdict.red{border-left:3px solid var(--red)}
.verdict.amber{border-left:3px solid var(--amber)}
.verdict.green{border-left:3px solid var(--green)}
.verdict.unknown{border-left:3px solid var(--dim)}

main{max-width:1320px;margin-inline:auto;padding:22px 20px 70px}
h2{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin:26px 0 10px}
h2:first-child{margin-top:0}
h2 i{font-style:normal;color:var(--line-2);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px}

/* ── scheda ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 13px;
  border-left:3px solid var(--line-2);display:flex;flex-direction:column;gap:7px}
.card.red{border-left-color:var(--red)}
.card.amber{border-left-color:var(--amber)}
.card.green{border-left-color:var(--green)}
.card.unknown{border-left-color:var(--dim)}
.card.info{border-left-color:var(--steel)}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .id{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted);
  font-weight:600;overflow-wrap:anywhere}
.card .lv{margin-left:auto;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.06em;padding:2px 6px;border-radius:2px;border:1px solid var(--line-2);color:var(--dim)}
.card.red .lv{color:var(--red);border-color:rgba(240,115,109,.4)}
.card.amber .lv{color:var(--amber);border-color:rgba(240,180,52,.4)}
.card.green .lv{color:var(--green-2);border-color:rgba(47,187,104,.35)}
.card .head{font-size:13px;line-height:1.45}
.card .meta{font-size:11px;color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.acts button{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;font-weight:600;
  cursor:pointer;padding:5px 9px;border-radius:3px;border:1px solid var(--line-2);
  background:var(--inset);color:var(--muted);transition:.12s}
.acts button:hover:not(:disabled){color:var(--text);border-color:var(--steel)}
.acts button:disabled{opacity:.45;cursor:not-allowed}
.acts button:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.acts button.on:hover:not(:disabled){color:var(--green-2);border-color:var(--green)}
.acts button.off:hover:not(:disabled){color:var(--red);border-color:var(--red)}
.acts button.fix:hover:not(:disabled){color:var(--violet);border-color:var(--violet)}
.esito{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10.5px;color:var(--dim);
  line-height:1.5;overflow-wrap:anywhere}
.esito.ok{color:var(--green-2)} .esito.ko{color:var(--red)}
.report{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;white-space:pre-wrap;
  background:var(--inset);border:1px solid var(--line);border-radius:3px;padding:9px;
  max-height:340px;overflow:auto;margin-top:6px}

/* ── righe (lab) ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:baseline;
  padding:8px 13px 8px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.row:last-child{border-bottom:0}
.row:nth-child(even){background:var(--panel-2)}
.row.red{border-left-color:var(--red)}.row.amber{border-left-color:var(--amber)}
.row.green{border-left-color:var(--green)}
.row .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;
  white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.row.red .k{color:var(--red)}.row.amber .k{color:var(--amber)}
.row .t{min-width:0;overflow-wrap:anywhere;font-size:13px}
.row .t small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px;line-height:1.45}
.row .p{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);
  white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 13px;
  border-top:2px solid var(--line-2)}
.kpi.red{border-top-color:var(--red)}.kpi.amber{border-top-color:var(--amber)}
.kpi.green{border-top-color:var(--green)}
.kpi b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:25px;
  font-weight:700;letter-spacing:-.03em;line-height:1.12;font-variant-numeric:tabular-nums}
.kpi u{font-size:13px;color:var(--muted);text-decoration:none}
.kpi span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.vuoto{padding:15px 13px;color:var(--dim);font-size:12.5px}
.nota{color:var(--dim);font-size:11.5px;margin-top:9px;line-height:1.55}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;background:var(--inset);
  border:1px solid var(--line);padding:1px 5px;border-radius:2px;color:var(--steel)}
iframe{width:100%;height:calc(100vh - 190px);border:1px solid var(--line);border-radius:4px;
  background:var(--bg)}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><i class="dot" id="pulse"></i> BetRedge · Sala Controllo</div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-v="postazioni">Postazioni</button>
    <button role="tab" aria-selected="false" data-v="check">Check</button>
    <button role="tab" aria-selected="false" data-v="lab">Lab</button>
    <button role="tab" aria-selected="false" data-v="mappa">Mappa</button>
  </div>
  <div class="stamp mono" id="stamp">—</div>
</div>

<div class="verdict unknown" id="verdict">
  <b id="vh">in attesa dello snapshot</b><span id="vd"></span>
</div>

<main>
  <section id="v-postazioni"></section>
  <section id="v-check" hidden></section>
  <section id="v-lab" hidden></section>
  <section id="v-mappa" hidden>
    <h2>Architettura <i>46 nodi · clic per isolare, Esc per rilasciare</i></h2>
    <iframe id="mappa" title="Mappa dell'architettura BetRedge" loading="lazy"></iframe>
  </section>
</main>

<script>
const TOKEN = "__CC_TOKEN__";

/* I reparti. L'elenco dei check NON e' qui: si prende dallo stato, cosi' non
   possono divergere. Qui c'e' solo il criterio di raggruppamento. */
const REPARTI = [
  {nome:"Motore delle predizioni", desc:"ingestione, modelli, pubblicazione",
   test:id => /agents|predict|collect|goalscorer/.test(id)},
  {nome:"Sorveglianza",            desc:"chi guarda che il resto giri",
   test:id => /watchdog|live-monitor|daemon-health/.test(id)},
  {nome:"Consegna",                desc:"cio' che arriva all'utente",
   test:id => /weeklypick|morning/.test(id)},
];

const el = (t, c, txt) => { const e = document.createElement(t);
  if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

function eta(iso){
  if(!iso) return "—";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
  if (s < 90) return Math.round(s) + "s fa";
  if (s < 5400) return Math.round(s/60) + "m fa";
  if (s < 172800) return Math.round(s/3600) + "h fa";
  return Math.round(s/86400) + "gg fa";
}

async function chiedi(azione, check_id){
  try{
    const r = await fetch("/api/action", {method:"POST",
      headers:{"Content-Type":"application/json","X-CC-Token":TOKEN},
      body: JSON.stringify({azione, check_id})});
    return await r.json();
  }catch(e){ return {ok:false, errore:String(e)}; }
}

/* Una scheda con i tasti. `spegni` chiede conferma: e' l'unica azione che
   toglie qualcosa invece di rimetterlo. */
function scheda(id, c, job){
  const box = el("div", "card " + (c.level || "unknown"));
  const top = el("div", "top");
  top.append(el("i", "dot " + (c.level === "green" ? "" : c.level)),
             el("span", "id", id), el("span", "lv", c.level || "?"));
  box.append(top, el("div", "head", c.headline || "—"),
             el("div", "meta", `${c.source || "—"} · ${eta(c.measured_at)}`));

  const acts = el("div", "acts");
  const esito = el("div", "esito");

  const premi = (b, azione, etichetta, conferma) => {
    b.addEventListener("click", async () => {
      if (conferma && !window.confirm(conferma)) return;
      b.disabled = true; const prima = b.textContent; b.textContent = "…";
      const r = await chiedi(azione, id);
      esito.className = "esito " + (r.ok ? "ok" : "ko");
      esito.textContent = r.ok
        ? `${etichetta}: ${r.azione || "fatto"} — il prossimo giro lo riverifica`
        : `non riuscito: ${r.errore || r.stderr || "errore"}`;
      b.textContent = prima; b.disabled = false;
      if (r.ok) setTimeout(render, 2500);
    });
    acts.appendChild(b);
  };

  if (c.riavviabile){
    premi(el("button", "on",  "● accendi"), "accendi", "acceso", null);
    premi(el("button", "off", "○ spegni"),  "spegni",  "spento",
          `Spegnere ${id}?\n\nSmette di girare finche' non lo riaccendi. Reversibile.`);
    premi(el("button", "",    "↻ riavvia"), "riavvia", "riavviato", null);
  }

  const inCorso = job && (job.stato === "in_coda" || job.stato === "in_corso");
  const fix = el("button", "fix", inCorso ? `⚡ Claude: ${job.stato.replace("_"," ")}` : "⚡ fix");
  fix.disabled = Boolean(inCorso);
  premi(fix, "diagnosi", "diagnosi accodata", null);

  if (job && job.stato === "pronto"){
    const v = el("button", "", "leggi la diagnosi");
    v.addEventListener("click", async () => {
      const gia = box.querySelector(".report");
      if (gia){ gia.remove(); return; }
      const testo = await (await fetch(`/api/report?id=${encodeURIComponent(job.report)}`)).text();
      box.appendChild(el("div", "report", testo));
    });
    acts.appendChild(v);
  }
  if (job && job.stato === "fallito") esito.textContent = "la diagnosi precedente e' fallita";

  box.append(acts, esito);
  return box;
}

function vistaPostazioni(st, jobs){
  const sez = document.getElementById("v-postazioni");
  sez.textContent = "";
  const voci = Object.entries(st.checks || {});
  const governabili = voci.filter(([, c]) => c.riavviabile);
  const usati = new Set();

  for (const r of REPARTI){
    const sel = governabili.filter(([id]) => r.test(id));
    sel.forEach(([id]) => usati.add(id));
    if (!sel.length) continue;
    const h = el("h2", "", r.nome); h.appendChild(el("i", "", "· " + r.desc));
    sez.appendChild(h);
    const g = el("div", "grid");
    ordina(sel).forEach(([id, c]) => g.appendChild(scheda(id, c, jobs[id])));
    sez.appendChild(g);
  }
  const resto = governabili.filter(([id]) => !usati.has(id));
  if (resto.length){
    const h = el("h2", "", "Altri di perimetro"); sez.appendChild(h);
    const g = el("div", "grid");
    ordina(resto).forEach(([id, c]) => g.appendChild(scheda(id, c, jobs[id])));
    sez.appendChild(g);
  }
  sez.appendChild(el("p", "nota",
    "I tasti agiscono solo su questi: sono i daemon che il control center sorveglia. " +
    "Gli altri della macchina stanno sotto Lab, in sola lettura — spegnere un bridge del " +
    "Council o il bot Telegram non si nota subito."));
}

const RANGO = {red:0, amber:1, unknown:2, info:3, green:4};
const ordina = a => a.sort((x, y) => (RANGO[x[1].level] ?? 9) - (RANGO[y[1].level] ?? 9));

function vistaCheck(st, jobs){
  const sez = document.getElementById("v-check");
  sez.textContent = "";
  const voci = Object.entries(st.checks || {});
  const rotti = voci.filter(([, c]) => c.level === "red" || c.level === "amber");

  const blocco = (titolo, sel, vuoto) => {
    const h = el("h2", "", titolo); h.appendChild(el("i", "", "· " + sel.length));
    sez.appendChild(h);
    if (!sel.length){ sez.appendChild(el("div", "vuoto", vuoto)); return; }
    const g = el("div", "grid");
    ordina(sel).forEach(([id, c]) => g.appendChild(scheda(id, c, jobs[id])));
    sez.appendChild(g);
  };
  blocco("Da guardare adesso", rotti, "Niente rosso né ambra.");
  const gruppi = [...new Set(voci.map(([, c]) => c.group).filter(Boolean))].sort();
  for (const gr of gruppi) blocco(gr, voci.filter(([, c]) => c.group === gr), "vuoto");
}

function riga(cls, k, titolo, sotto, pill){
  const r = el("div", "row " + cls);
  r.append(el("span", "k", k));
  const t = el("span", "t", titolo);
  if (sotto) t.appendChild(el("small", "", sotto));
  r.append(t, el("span", "p", pill || ""));
  return r;
}

function vistaLab(lab){
  const sez = document.getElementById("v-lab");
  sez.textContent = "";
  if (!lab || lab.assente){
    sez.appendChild(el("div", "vuoto",
      "Nessun dato del lab. Generalo con: lab stato --json"));
    return;
  }
  const p = lab.progetti || {};
  const sw = parseFloat(lab.macchina?.swap_usato || 0),
        swt = parseFloat(lab.macchina?.swap_tot || 1),
        swp = swt ? Math.round(sw / swt * 100) : 0;

  sez.appendChild(el("h2", "", "Il lavoro"));
  const k = el("div", "kpis");
  const kpi = (cls, n, u, lab2) => {
    const d = el("div", "kpi " + cls);
    const b = el("b", "", String(n));
    if (u) b.appendChild(el("u", "", " " + u));
    d.append(b, el("span", "", lab2)); return d;
  };
  k.append(kpi("", p.ATTIVO ?? 0, "", "progetti attivi"),
           kpi(p.BLOCCATO ? "red" : "green", p.BLOCCATO ?? 0, "", "bloccati"),
           kpi((lab.fermi || []).length ? "amber" : "green", (lab.fermi || []).length, "", "fermi oltre 14gg"),
           kpi("", (lab.shell || []).length, "/ " + (lab.mcp ?? 0), "shell / proc. MCP"),
           kpi("", (lab.worktree || []).length, "", "worktree"),
           kpi(swp > 70 ? "red" : swp > 40 ? "amber" : "green", swp, "%", "swap"));
  sez.appendChild(k);

  sez.appendChild(el("h2", "", "Aspettano una persona"));
  const p1 = el("div", "panel");
  (lab.bloccati_per_owner || []).forEach(b =>
    p1.appendChild(riga("red", b.quanti, b.owner, (b.progetti || []).join(", "), "attende")));
  if (!(lab.bloccati_per_owner || []).length) p1.appendChild(el("div", "vuoto", "Nessuno."));
  sez.appendChild(p1);

  sez.appendChild(el("h2", "", "Attivi ma fermi da oltre due settimane"));
  const p2 = el("div", "panel");
  (lab.fermi || []).slice(0, 14).forEach(f =>
    p2.appendChild(riga(f.giorni >= 35 ? "red" : "amber", f.giorni + "gg", f.nome,
                        f.azione || "nessuna azione scritta", f.owner)));
  if (!(lab.fermi || []).length) p2.appendChild(el("div", "vuoto", "Nessuno."));
  sez.appendChild(p2);

  sez.appendChild(el("h2", "", "I daemon della macchina"));
  const p3 = el("div", "panel");
  (lab.daemoni || []).forEach(d => {
    const rotto = d.verdetto.startsWith("MUTO");
    p3.appendChild(riga(rotto ? "red" : d.caricato ? "green" : "",
                        d.eta == null ? "—" : d.eta + "gg", d.label,
                        rotto ? "nessuna riga di log: puo' essere fermo in silenzio" : "",
                        d.verdetto));
  });
  sez.appendChild(p3);
  sez.appendChild(el("p", "nota",
    "Questi sono in sola lettura di proposito. I tasti stanno sotto Postazioni, " +
    "solo sugli 8 che il control center sorveglia."));

  sez.appendChild(el("h2", "", "Repo"));
  const p4 = el("div", "panel");
  (lab.worktree || []).forEach(w =>
    p4.appendChild(riga(w.dirty !== "0" ? "amber" : "", w.dirty, w.branch, w.path,
                        w.dirty !== "0" ? "non committati" : "pulito")));
  sez.appendChild(p4);
  sez.appendChild(el("p", "nota",
    `vetrina su ${lab.branch?.vetrina} · ${lab.branch?.locali} branch locali, ` +
    `${lab.branch?.mergiati} già mergiati · dati del lab: ${eta(lab.generato)}`));
}

let mappaCaricata = false;
function mostra(nome){
  for (const v of ["postazioni","check","lab","mappa"])
    document.getElementById("v-" + v).hidden = (v !== nome);
  document.querySelectorAll(".tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.v === nome)));
  if (nome === "mappa" && !mappaCaricata){
    document.getElementById("mappa").src = "/architettura.html";
    mappaCaricata = true;
  }
  try{ localStorage.setItem("cc-vista", nome); }catch(e){}
}

async function render(){
  let st = {}, jobs = {}, lab = {};
  try{
    [st, jobs, lab] = await Promise.all([
      fetch("/api/state", {cache:"no-store"}).then(r => r.json()).catch(() => ({})),
      fetch("/api/jobs",  {cache:"no-store"}).then(r => r.json()).catch(() => ({})),
      fetch("/api/lab",   {cache:"no-store"}).then(r => r.json()).catch(() => ({})),
    ]);
  }catch(e){}

  const stamp = document.getElementById("stamp");
  if (!st.generated_at){
    stamp.textContent = "nessuno snapshot: il collector non ha ancora girato";
  }else{
    stamp.textContent = "snapshot " + eta(st.generated_at);
  }
  const lv = st.summary?.level || "unknown";
  document.getElementById("verdict").className = "verdict " + lv;
  document.getElementById("pulse").className = "dot " + (lv === "green" ? "" : lv);
  document.getElementById("vh").textContent = st.summary?.headline || "—";
  document.getElementById("vd").textContent = st.summary?.detail || "";

  vistaPostazioni(st, jobs);
  vistaCheck(st, jobs);
  vistaLab(lab);
}

document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => mostra(b.dataset.v)));
let salvata = null;
try{ salvata = localStorage.getItem("cc-vista"); }catch(e){}
render().then(() => { if (salvata) mostra(salvata); });
setInterval(render, 60000);
</script>
</body>
</html>
