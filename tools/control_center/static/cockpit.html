<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit · Maven / BetRedge</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   COCKPIT — la home della torre. Una schermata, una domanda: devo agire?

   Punto di vista: e' un semaforo che parla. La banda in alto e' l'unico
   elemento che cambia colore con lo stato di tutta la pagina; il colore
   di stato vive SOLO li', sul bordo del ticket e sulla barretta di salute
   del progetto. Le azioni sono sempre nell'accento (ciano, outline): cosi'
   un problema e' un rosso, non tre. Chi vuole esplorare ha /canvas.

   Stesso sistema di index.html: Saira + JetBrains Mono vendorizzati, notte
   blu, hairline, angoli netti, smusso a 45 gradi, parentesi d'angolo. I
   token sono copiati da li' (righe 25-35), non reinventati.
   Modulo: 8px. Griglia: banda / due colonne 440px + 1fr / pieghe / piede.
   ═══════════════════════════════════════════════════════════════════════ */
@font-face{font-family:"Saira";src:url("/vendor/fonts/saira.woff2") format("woff2");
  font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("/vendor/fonts/jetbrains-mono.woff2") format("woff2");
  font-weight:100 800;font-display:swap}

:root{
  --void:#04070E; --deep:#070C18; --panel:#0A1120; --panel-2:#0D1728; --inset:#060B15;
  --line:#132742; --line-2:#1D3B60; --line-3:#2A4D7A;
  --ink:#D6E4F7; --mid:#8AA6C8; --dim:#6784A6;
  --cy:#38BDF8; --cy-2:#7DD3FC;
  --green:#28C76F; --amber:#F5A524; --red:#F0525B; --violet:#A78BFA;
  --sans:"Saira","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --u:8px;
  --stato:var(--dim);          /* il colore del verdetto: lo imposta il JS sulla banda */
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;min-height:100%;background:var(--void);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--cy-2)}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--cy);outline-offset:2px}
b,strong{font-weight:600}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.vis-nascosto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── la pagina ─── */
.pagina{max-width:1560px;margin:0 auto;padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*2);
  display:flex;flex-direction:column;gap:calc(var(--u)*2);min-height:100vh}
main{display:flex;flex-direction:column;gap:calc(var(--u)*2);flex:1}

/* ─── testa ─── */
.testa{display:flex;align-items:center;gap:calc(var(--u)*3);flex-wrap:wrap;height:44px}
.marchio{display:flex;align-items:center;gap:12px}
.marchio .m{width:36px;height:36px;display:grid;place-items:center;background:var(--cy);color:var(--void);
  font-family:var(--mono);font-weight:700;font-size:18px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.marchio b{display:block;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1.1}
.marchio span{display:block;font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.04em}
.aree{display:flex;gap:6px;align-items:center;margin-left:calc(var(--u)*2)}
.aree .eti{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.area{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border:1px solid var(--line-2);color:var(--mid);background:var(--inset);transition:.12s}
.area:hover:not(:disabled){color:var(--ink);border-color:var(--line-3)}
.area.attiva{border-color:var(--cy);color:var(--cy-2);background:rgba(56,189,248,.08)}
.area:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.ora{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap}
.ora b{color:var(--mid);font-weight:500}
.vista{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;letter-spacing:.04em;
  border-bottom:1px solid var(--line-2);padding-bottom:1px;white-space:nowrap}
.vista:hover{color:var(--cy-2);border-color:var(--cy)}

/* ─── parentesi d'angolo: il marchio identitario della torre ─── */
.ang{position:relative}
.ang::after{content:"";position:absolute;right:-1px;top:-1px;width:18px;height:18px;
  border:2px solid var(--cy);border-left:0;border-bottom:0;pointer-events:none;opacity:.85}

/* ─── la banda del verdetto ─── */
.verdetto{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*3);align-items:stretch;
  border:1px solid var(--line);border-left:6px solid var(--stato);
  background:linear-gradient(90deg,color-mix(in srgb,var(--stato) 13%,transparent),transparent 48%),var(--panel);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
  transition:border-color .35s,background .35s;min-height:150px}
.verdetto .frase{padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*2.5);display:flex;flex-direction:column;
  justify-content:center;gap:4px;min-width:0}
.verdetto .eti{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.verdetto h1{margin:0;font-size:60px;font-weight:700;line-height:1;letter-spacing:-.02em;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;overflow-wrap:anywhere}
.verdetto h1 .n{color:var(--stato);font-variant-numeric:tabular-nums}
.verdetto h1 .led-g{width:40px;height:40px;background:var(--green);flex:none}
.verdetto[data-livello="none"] h1{font-weight:500;color:var(--mid)}
.verdetto .sotto{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6;
  overflow-wrap:anywhere}
.verdetto .sotto b{color:var(--mid);font-weight:500}
.verdetto .sotto .stantio{color:var(--amber)}
.verdetto .sotto .btn{margin-left:8px}
/* i numeri chiave: tile mono con cifra grande (da B), separate da hairline */
.numeri{display:grid;grid-template-columns:repeat(4,minmax(128px,auto));padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*2) 0}
.numeri .k{padding:8px 22px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;min-width:0}
.numeri .k b{display:block;font-family:var(--mono);font-size:40px;font-weight:600;line-height:1.05;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.numeri .k b small{font-size:18px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:2px}
.numeri .k em{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:6px;white-space:nowrap}
.numeri .k.stantio b{color:var(--amber)}

/* ─── le due colonne ─── */
.colonne{display:grid;grid-template-columns:440px minmax(0,1fr);gap:calc(var(--u)*2);align-items:start}
.pannello{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:420px}
.pannello>h2{margin:0;display:flex;align-items:baseline;gap:12px;padding:14px 18px 12px;
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--line)}
.pannello>h2 small{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim)}
.pannello>h2 .dx{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim)}

/* ─── i ticket ─── */
.ticket-list{display:flex;flex-direction:column;gap:12px;padding:14px}
.ticket{position:relative;border:1px solid var(--line-2);border-top:3px solid var(--stato);background:var(--inset);
  display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 12px;padding:14px 14px 14px 12px}
.ticket .n{font-family:var(--mono);font-size:36px;font-weight:700;line-height:1;color:var(--stato);
  letter-spacing:-.04em;padding-top:2px;text-align:center}
.ticket h3{margin:0 0 8px;font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.ticket dl{margin:0;display:grid;grid-template-columns:54px minmax(0,1fr);gap:3px 10px;font-size:12px;line-height:1.45}
.ticket dt{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.02em;padding-top:2px}
.ticket dd{margin:0;color:var(--mid);overflow-wrap:anywhere}
.ticket dd .mono{font-size:11.5px}
.ticket dd b{color:var(--ink);font-weight:500}
.ticket .evid{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.ticket .tag{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line-2);padding:1px 7px;
  display:inline-flex;align-items:center;gap:6px}
.ticket .fonte{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:8px;overflow-wrap:anywhere;opacity:.85}
.ticket .azioni{grid-column:2;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ticket .conferma{grid-column:2}
.ticket .esito{grid-column:2}

/* ─── LED quadrato: lo stato ha una forma, non solo un colore ─── */
.led{display:inline-block;width:8px;height:8px;flex:none;background:var(--dim);vertical-align:middle}
.led.green{background:var(--green)}.led.red{background:var(--red)}.led.amber{background:var(--amber)}
.led.unknown,.led.sconosciuto{background:transparent;border:1px dashed var(--violet)}

/* ─── pulsanti: outline nell'accento, mai pieni ─── */
.btn{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:8px 12px;border:1px solid var(--cy);background:transparent;color:var(--cy-2);text-align:center;
  text-decoration:none;display:inline-block;transition:.12s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(56,189,248,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.largo{flex:1 1 auto}
.btn.quieto{border-color:var(--line-2);color:var(--mid);text-transform:none;letter-spacing:.02em;font-weight:500}
.btn.quieto:hover:not(:disabled){border-color:var(--line-3);color:var(--ink);background:transparent}
.btn.piccolo{padding:4px 9px;font-size:10.5px}
.esito{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.5;overflow-wrap:anywhere;margin-top:8px}
.esito.ok{color:var(--green)}.esito.ko{color:var(--red)}
/* la conferma vive dentro il ticket o la riga, non in una finestra del browser */
.conferma{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-top:10px;
  border:1px solid var(--amber);background:rgba(245,165,36,.07);font-size:12.5px}
.conferma .q{flex:1 1 100%;color:var(--ink);line-height:1.5}
.conferma .q code{font-family:var(--mono);font-size:11px;color:var(--cy-2);background:var(--void);
  border:1px solid var(--line);padding:0 4px}

/* ─── stato vuoto: disegnato, non assente ─── */
.vuoto{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:40px 24px;text-align:center;color:var(--mid)}
.vuoto .quadro{width:64px;height:64px;border:1px solid var(--line-3);display:grid;place-items:center}
.vuoto .quadro i{width:22px;height:22px;background:var(--green);display:block}
.vuoto .quadro.grigio i{background:transparent;border:1px dashed var(--dim)}
.vuoto p{margin:0;font-size:14px;line-height:1.5}
.vuoto p b{display:block;font-weight:600;color:var(--ink)}
.vuoto small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.6}
.vuoto code{font-family:var(--mono);font-size:11px;color:var(--cy-2);background:var(--inset);border:1px solid var(--line);padding:0 4px}

/* ─── progetti: intestazione + righe ─── */
.griglia-p{--cols:minmax(150px,1.1fr) auto minmax(120px,1.3fr) 168px minmax(140px,1.1fr) 28px}
.intesta{display:grid;grid-template-columns:var(--cols);gap:16px;align-items:center;padding:10px 18px 8px 22px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--line)}
.righe{display:flex;flex-direction:column}
.riga{position:relative;border-bottom:1px solid var(--line)}
.riga:last-child{border-bottom:0}
.riga .capo{display:grid;grid-template-columns:var(--cols);gap:16px;align-items:center;padding:13px 18px 13px 22px;
  width:100%;text-align:left;color:inherit;min-height:56px;transition:background .12s}
.riga .capo:hover{background:var(--panel-2)}
/* UNA sola codifica di salute: la barretta verticale a inizio riga. Niente
   quadratino a destra. Senza check collegati e' neutra: non misurato ≠ sano. */
.riga .salute{position:absolute;left:0;top:10px;bottom:10px;width:4px;background:var(--line-2)}
.riga[data-salute="green"] .salute{background:var(--green)}
.riga[data-salute="amber"] .salute{background:var(--amber)}
.riga[data-salute="red"] .salute{background:var(--red)}
.riga[data-salute="unknown"] .salute,.riga[data-salute="sconosciuto"] .salute{background:transparent;border:1px dashed var(--violet);width:3px}
.riga.aperta .salute{top:10px}
.riga .nome{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.riga .nome small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--dim);margin-top:2px}
/* la fase e' un fatto, non uno stato: pill neutra. BLOCCATO prende la forma
   dell'attesa (tratteggio), non il rosso — il rosso e' di Andrea. */
.fase{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mid);border:1px solid var(--line-2);padding:3px 9px;white-space:nowrap;justify-self:start}
.fase.BLOCCATO{border-style:dashed;border-color:var(--line-3);color:var(--ink)}
.fase.OPERATIVO{color:var(--dim)}
.riga .goal{font-size:13px;color:var(--mid);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.riga .goal:empty::before{content:"— goal non dichiarato";color:var(--dim);font-family:var(--mono);font-size:11.5px}
/* la barra a tacche (da B): una tacca per task, si riempiono al caricamento */
.tacche{display:flex;align-items:center;gap:10px;min-width:0}
.tacche .b{display:flex;gap:2px;height:10px;flex:1;max-width:120px}
.tacche .b i{flex:1;background:var(--line);position:relative;overflow:hidden}
.tacche .b i::after{content:"";position:absolute;inset:0;background:var(--mid);transform:scaleX(0);transform-origin:left;
  transition:transform .35s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.tacche .b i.on::after{transform:scaleX(1)}
.tacche .b.pieno i::after{background:var(--cy)}
.tacche .n{font-family:var(--mono);font-size:12px;color:var(--mid);font-variant-numeric:tabular-nums;white-space:nowrap}
.tacche .n.vuoto-t{color:var(--dim)}
.riga .prossimo{font-family:var(--mono);font-size:12px;color:var(--mid);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.riga .prossimo.nessuno{color:var(--dim)}
.riga .chev{width:24px;height:24px;display:grid;place-items:center;color:var(--dim);justify-self:end;transition:transform .2s}
.riga .chev svg{display:block}
.riga.aperta .chev{transform:rotate(180deg);color:var(--cy)}
.riga .capo:hover .chev{color:var(--cy-2)}

/* ─── la riga espansa: i task ─── */
.dett{margin:0 18px 14px 22px;border:1px solid var(--line);background:var(--inset)}
.dett .task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:9px 14px;
  border-bottom:1px solid var(--line)}
.dett .task:last-child{border-bottom:0}
.dett .task .t{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.dett .task .t small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px;
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dett .task .t small .led{width:7px;height:7px}
.dett .task.chiuso .t{color:var(--mid)}
.dett .task .st{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;text-align:right;padding-top:3px}
.dett .task .st.green{color:var(--green)}.dett .task .st.red{color:var(--red)}.dett .task .st.amber{color:var(--amber)}
.spunta{width:18px;height:18px;border:1px solid var(--line-3);background:transparent;display:grid;place-items:center;
  margin-top:1px;transition:.12s;color:var(--void);font-family:var(--mono);font-size:12px;font-weight:700;line-height:1}
.spunta[aria-checked="true"]{background:var(--mid);border-color:var(--mid)}
.spunta[aria-checked="true"]::after{content:"✓"}
.spunta:not(:disabled):hover{border-color:var(--cy)}
.spunta:disabled{cursor:default}
.spunta.riaperto{border-color:var(--red);background:transparent;color:var(--red)}
.spunta.riaperto::after{content:"!"}
.spunta.verificato{border-color:var(--green);background:transparent;color:var(--green)}
.spunta.verificato::after{content:"✓"}
.dett .task .conferma,.dett .task .esito{grid-column:2/-1}
.dett .fondo{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}
.dett .fondo b{color:var(--mid);font-weight:500}
.dett .fondo .btn{margin-left:auto}
.dett .senza{padding:12px 14px;font-size:12.5px;color:var(--dim);line-height:1.55}
.dett .senza code{font-family:var(--mono);font-size:11px;color:var(--cy-2);background:var(--void);border:1px solid var(--line);padding:0 4px}

/* ─── le pieghe: in carico / da osservare, archivio ─── */
.piega{border:1px solid var(--line);background:var(--panel)}
.piega summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 18px;
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);user-select:none}
.piega summary::-webkit-details-marker{display:none}
.piega summary .chev{color:var(--dim);transition:transform .2s;display:grid;place-items:center}
.piega[open] summary .chev{transform:rotate(180deg);color:var(--cy)}
.piega summary small{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim)}
.piega summary:hover{background:var(--panel-2)}
.piega .corpo{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0}
.piega .corpo.uno{grid-template-columns:1fr}
.piega .blocco+.blocco{border-left:1px solid var(--line)}
.piega .blocco h4{margin:0;padding:10px 18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:600;border-bottom:1px solid var(--line)}
.piega .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:8px 18px;
  border-bottom:1px solid var(--line);font-size:13px}
.piega .r:last-child{border-bottom:0}
.piega .r .k1{font-family:var(--mono);font-size:12px;color:var(--mid);white-space:nowrap}
.piega .r .t1{min-width:0;overflow-wrap:anywhere}
.piega .r .t1 small{display:block;color:var(--dim);font-size:11.5px;font-family:var(--mono)}
.piega .r .p1{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.piega .nulla{padding:14px 18px;color:var(--dim);font-size:12.5px;line-height:1.55}

/* ─── piede: i tasti rapidi (da B) ─── */
.piede{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:11.5px;color:var(--dim);padding:4px 0 0}
.piede kbd{font-family:var(--mono);font-size:10.5px;color:var(--mid);border:1px solid var(--line-2);padding:0 5px;margin-right:5px}
.piede .stamp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.piede .stamp b{color:var(--mid);font-weight:500}
.piede .stamp.ko{color:var(--red)}

/* ─── responsive ─── */
@media (max-width:1180px){
  .colonne{grid-template-columns:380px minmax(0,1fr)}
  .griglia-p{--cols:minmax(140px,1.2fr) auto 150px minmax(120px,1fr) 28px}
  .intesta .h-goal,.riga .goal{display:none}
}
@media (max-width:980px){
  .verdetto{grid-template-columns:1fr}
  .verdetto .frase{padding-bottom:0}
  .numeri{padding:8px calc(var(--u)*3) calc(var(--u)*2);grid-template-columns:repeat(4,1fr)}
  .numeri .k{padding:8px 16px}.numeri .k:first-child{border-left:0;padding-left:0}
  .numeri .k b{font-size:32px}
  .verdetto h1{font-size:44px}
  .colonne{grid-template-columns:1fr}
  .pannello{min-height:0}
}
@media (max-width:720px){
  .pagina{padding:12px 16px}
  .testa{height:auto}
  .ora{margin-left:0;flex:1 1 100%;order:5}
  .griglia-p{--cols:minmax(0,1fr) auto 28px}
  .intesta{display:none}
  .riga .prossimo,.riga .tacche{display:none}
  .numeri{grid-template-columns:1fr 1fr}
  .numeri .k{border-left:0;padding-left:0}
  .verdetto h1{font-size:36px}
  .ticket{grid-template-columns:40px minmax(0,1fr)}
  .ticket .n{font-size:28px}
  .piega .corpo{grid-template-columns:1fr}
  .piega .blocco+.blocco{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="pagina">

<header class="testa">
  <a class="marchio" href="/" aria-label="Maven · Sala controllo" style="text-decoration:none;color:inherit">
    <div class="m">M</div><div><b>Maven</b><span>Sala controllo · cockpit</span></div>
  </a>
  <nav class="aree" id="aree" aria-label="Area"></nav>
  <div class="ora"><span id="area-nome">—</span> · <span id="data">—</span> · <b id="orologio">—</b></div>
  <a class="vista" href="/canvas" title="Il piano zoomabile: Sala, Cervello, Progetti, Daemon">Vista completa ↗</a>
</header>

<main>
  <section class="verdetto ang" id="verdetto" data-livello="none" aria-live="polite">
    <div class="frase">
      <span class="eti">Verdetto</span>
      <h1 id="titolo"><span class="n">…</span></h1>
      <p class="sotto" id="sotto">in attesa di <code class="mono">/api/cockpit</code></p>
    </div>
    <div class="numeri" id="numeri"></div>
  </section>

  <div class="colonne">
    <section class="pannello ang" id="richiedono" aria-labelledby="h-richiedono">
      <h2 id="h-richiedono">Richiedono te <small id="richiedono-n"></small></h2>
      <div id="ticket"></div>
    </section>

    <section class="pannello ang griglia-p" id="progetti" aria-labelledby="h-progetti">
      <h2 id="h-progetti">Progetti <small id="progetti-n"></small><span class="dx" id="progetti-nota"></span></h2>
      <div class="intesta" aria-hidden="true">
        <span>Nome</span><span>Fase</span><span class="h-goal">Obiettivo</span><span>Task</span><span>Prossimo task</span><span></span>
      </div>
      <div class="righe" id="righe"></div>
    </section>
  </div>

  <details class="piega" id="osserva">
    <summary><span class="chev"><svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1.5l5 5 5-5"/></svg></span>
      In carico / da osservare <small id="osserva-n">—</small></summary>
    <div class="corpo" id="osserva-corpo"></div>
  </details>

  <details class="piega" id="archivio">
    <summary><span class="chev"><svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1.5l5 5 5-5"/></svg></span>
      Archivio <small id="archivio-n">—</small></summary>
    <div class="corpo uno" id="archivio-corpo"></div>
  </details>
</main>

<footer class="piede">
  <span><kbd>R</kbd>aggiorna</span>
  <span><kbd>E</kbd>apri / chiudi i progetti</span>
  <span><kbd>C</kbd>vista completa</span>
  <span><kbd>Esc</kbd>annulla una conferma</span>
  <span class="stamp" id="stamp">—</span>
</footer>

</div>

<script>
/* ═══════════════════════════════ base ═══════════════════════════════ */
const TOKEN = "__CC_TOKEN__";
const $ = id => document.getElementById(id);
const el = (t,c,x) => { const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; };
const RIDOTTO = matchMedia("(prefers-reduced-motion: reduce)").matches;
const POLL_MS = 60000;
const STANTIO_S = 15*60;   /* il collector gira ogni 5 min: uno snapshot di 15 e' vecchio */

/* Le aree: oggi solo BetRedge ha card con `Area:` e check nello snapshot.
   Le altre entrano qui quando esistono; la pagina e' gia' pronta a leggerle
   dallo stesso endpoint (`?area=`). */
const AREE = [
  {id:"betredge", nome:"BetRedge", attiva:true},
];
function areaDaHash(){
  const m=location.hash.match(/area=([a-z0-9_-]+)/i);
  const id=m?m[1].toLowerCase():null;
  return (AREE.find(a=>a.id===id&&a.attiva)||AREE[0]).id;
}
let AREA = areaDaHash();
let DATI = null;            /* l'ultimo cockpit ricevuto */
let RICEVUTO = null;        /* quando */
let PRIMA_VOLTA = true;     /* il micro-movimento vive solo al primo disegno */
const APERTE = new Set();   /* righe espanse: sopravvivono al giro di aggiornamento */

const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function dataLocale(iso){
  if(!iso) return null;
  const s=String(iso);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  const d=new Date(s); return isNaN(d)?null:d;
}
function fmtData(iso){
  const d=dataLocale(iso); if(!d) return "—";
  const oggi=new Date();
  return d.getDate()+" "+MESI[d.getMonth()]+(d.getFullYear()!==oggi.getFullYear()?" "+d.getFullYear():"");
}
function fmtDataOra(iso){
  const d=dataLocale(iso); if(!d) return "—";
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return /^\d{4}-\d{2}-\d{2}$/.test(String(iso)) ? fmtData(iso) : fmtData(iso)+" "+hm;
}
function etaS(s){
  if(s==null) return "—";
  if(s<90) return Math.round(s)+" s";
  if(s<5400) return Math.round(s/60)+" min";
  if(s<172800) return Math.round(s/3600)+" h";
  return Math.round(s/86400)+" g";
}
function breve(s){
  if(s==null) return "—";
  if(s<5400) return Math.max(1,Math.round(s/60))+"m";
  if(s<172800) return Math.round(s/3600)+"h";
  return Math.round(s/86400)+"g";
}
function daQuando(iso){
  const d=dataLocale(iso); if(!d) return null;
  return Math.max(0,(Date.now()-d.getTime())/1000);
}
const taglia = (s,n) => { s=(s||"").trim(); return s.length>n ? s.slice(0,n-1)+"…" : s; };
const chev = () => { const s=el("span","chev"); s.innerHTML='<svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1.5l5 5 5-5"/></svg>'; return s; };

/* Conferma inline: al posto di window.confirm. Il fuoco va sul si', Esc
   annulla, Invio conferma. Finche' e' aperta il giro di aggiornamento aspetta. */
function conferma(dove, domanda, onOk, opz={}){
  const gia=dove.querySelector(".conferma"); if(gia) gia.remove();
  const box=el("div","conferma");
  const q=el("div","q"); if(typeof domanda==="string") q.textContent=domanda; else q.append(domanda);
  box.append(q);
  const ok=el("button","btn piccolo",opz.si||"conferma");
  const no=el("button","btn piccolo quieto","annulla");
  const chiudi=()=>box.remove();
  ok.addEventListener("click",()=>{ chiudi(); onOk(); });
  no.addEventListener("click",chiudi);
  box.addEventListener("keydown",ev=>{ if(ev.key==="Escape"){ev.stopPropagation();chiudi();(opz.ritorno||dove).focus?.();} if(ev.key==="Enter"){ev.preventDefault();ok.click();} });
  box.append(ok,no); dove.append(box);
  ok.focus();
}
function esito(dove, testo, ok){
  const gia=dove.querySelector(":scope > .esito"); if(gia) gia.remove();
  const e=el("div","esito "+(ok?"ok":"ko"),testo); dove.append(e); return e;
}

/* L'unica POST della pagina: la spunta di un task. Token nell'header,
   Origin controllato dal server, come le altre POST della torre. */
async function segnaFatto(id, indice, testo){
  try{
    const r=await fetch("/api/task/fatto",{method:"POST",
      headers:{"Content-Type":"application/json","X-CC-Token":TOKEN},
      body:JSON.stringify({id,indice,testo})});
    const j=await r.json().catch(()=>({}));
    return {status:r.status, ...j};
  }catch(e){ return {ok:false,errore:String(e)}; }
}

/* ═══════════════════════════════ derivazioni ═══════════════════════════════ */
/* Il livello di un ticket: rosso se c'e' un check rosso misurato o e' un
   rosso senza owner (triage); tutto il resto — scaduto, non misurato,
   BLOCCATO in attesa — e' ambra: Andrea deve agire, ma niente e' rotto. */
function livelloTicket(t){
  const lv=(t.evidenza||[]).map(e=>e.level);
  if(t.tipo==="check"||lv.includes("red")) return "red";
  return "amber";
}
/* La banda: rossa se almeno un ticket rosso, ambra se solo ambre, verde altrimenti. */
function livelloBanda(d){
  const l=(d.richiedono_te||[]).map(livelloTicket);
  if(l.includes("red")) return "red";
  if(l.length) return "amber";
  return "green";
}
function ordinaTicket(a,b){
  const la=livelloTicket(a), lb=livelloTicket(b);
  if(la!==lb) return la==="red"?-1:1;
  const da=dataLocale(a.da_quando), db=dataLocale(b.da_quando);
  if(da&&db) return da-db;         /* il piu' vecchio prima */
  if(da) return -1; if(db) return 1;
  return 0;
}
function etaSnapshot(d){ return d&&d.snapshot ? daQuando(d.snapshot) : null; }

/* ═══════════════════════════════ disegno ═══════════════════════════════ */
function contaSu(bEl, valore, suffisso){
  /* le cifre contano al primo caricamento; poi cambiano e basta */
  if(RIDOTTO||!PRIMA_VOLTA||typeof valore!=="number"||valore<2){ bEl.textContent=String(valore); if(suffisso) bEl.append(suffisso); return; }
  const t0=performance.now(), dur=520;
  const passo=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    bEl.textContent=String(Math.round(valore*e)); if(suffisso) bEl.append(suffisso);
    if(k<1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}
function tile(valore, etichetta, opz={}){
  const k=el("div","k"+(opz.stantio?" stantio":""));
  const b=el("b"); let suff=null;
  if(opz.su!=null){ suff=el("small","","/"+opz.su); }
  if(opz.testo!=null){ b.textContent=opz.testo; if(opz.piccolo) b.append(el("small","",opz.piccolo)); }
  else contaSu(b, valore, suff);
  k.append(b, el("em","",etichetta));
  return k;
}

function disegnaVerdetto(d){
  const banda=$("verdetto"), h1=$("titolo"), sotto=$("sotto"), num=$("numeri");
  const lv=livelloBanda(d), n=(d.richiedono_te||[]).length;
  banda.dataset.livello=lv;
  banda.style.setProperty("--stato", lv==="red"?"var(--red)":lv==="amber"?"var(--amber)":"var(--green)");
  h1.replaceChildren();
  if(n===0){
    h1.append(el("i","led-g"), el("span","","Tutto ok"));
  }else{
    h1.append(el("span","n",String(n)), el("span","",n===1?"cosa richiede te":"cose richiedono te"));
  }
  const eta=etaSnapshot(d), stantio=eta==null||eta>STANTIO_S;
  sotto.replaceChildren();
  const rossi=(d.richiedono_te||[]).filter(t=>livelloTicket(t)==="red").length;
  const parti=[];
  if(n===0) parti.push("niente che aspetti te");
  else parti.push(`${rossi} ${rossi===1?"rosso misurato":"rossi misurati"} · ${n-rossi} in attesa`);
  parti.push(`${(d.in_carico||[]).length} in carico ad altri`, `${(d.da_osservare||[]).length} da osservare`);
  sotto.append(parti.join(" · ")+" · ");
  const sn=el("span",stantio?"stantio":"", eta==null?"snapshot assente":`snapshot di ${etaS(eta)} fa`);
  if(stantio&&eta!=null) sn.title="il collector gira ogni 5 minuti: questo snapshot e' vecchio";
  sotto.append(sn);

  const N=d.numeri||{};
  num.replaceChildren(
    tile(N.progetti_attivi??0,"progetti attivi"),
    tile(N.bloccati??0,"bloccati"),
    tile(N.daemon_vivi??0,"daemon vivi",{su:N.daemon_totali??0}),
    tile(null,"misurato",{testo:eta==null?"—":breve(eta), piccolo:eta==null?"":" fa", stantio}),
  );
}

function bottone(testo, href){
  if(href){ const a=el("a","btn largo",testo); a.href=href; return a; }
  return el("button","btn largo",testo);
}
function ticket(t, i){
  const lv=livelloTicket(t);
  const art=el("article","ticket");
  art.style.setProperty("--stato", lv==="red"?"var(--red)":"var(--amber)");
  art.append(el("div","n",String(i+1)));
  const corpo=el("div");
  corpo.append(el("h3","",t.titolo||"—"));
  const dl=el("dl");
  const riga=(k,v)=>{ dl.append(el("dt","",k)); const dd=el("dd"); if(typeof v==="string") dd.textContent=v; else dd.append(v); dl.append(dd); };
  const ev=(t.evidenza||[]).filter(e=>e.check);
  /* i check misurati stanno nei tag con il LED: il "perche'" non li ripete per intero */
  const perche=el("span"); perche.textContent=ev.length?taglia(t.perche||"—",110):(t.perche||"—"); perche.title=t.perche||"";
  riga("Perché", perche);
  if(ev.length){
    const box=el("div","evid");
    for(const e of ev){ const s=el("span","tag"); s.append(el("i","led "+(e.level||"")), e.check+(e.headline?" · "+taglia(e.headline,40):"")); s.title=e.headline||""; box.append(s); }
    riga("Check", box);
  }
  const s=daQuando(t.da_quando);
  const da=el("span"); da.append(el("b","",s==null?"—":"da "+etaS(s)));
  if(t.da_quando) da.append(el("span","mono"," · "+fmtDataOra(t.da_quando)));
  if(t.progetto){ const p=(DATI.progetti||[]).find(p=>p.id===t.progetto); da.append(" · "+(p?p.titolo:t.progetto)); }
  riga("Da", da);
  if(t.azione&&t.azione!==t.titolo) riga("Azione", t.azione);
  corpo.append(dl);
  if(t.fonte){ const f=el("div","fonte",t.fonte); f.title="da dove viene questa voce"; corpo.append(f); }
  art.append(corpo);

  const az=el("div","azioni");
  const card=t.progetto?`/canvas#scheda=${encodeURIComponent(t.progetto)}`:null;
  if(t.tipo==="task"&&!(t.evidenza||[]).some(e=>e.check)){
    const b=bottone("Segna fatto");
    b.addEventListener("click",()=>{
      const q=document.createDocumentFragment();
      q.append("Segnare fatto «"+t.titolo+"»? Scrive ");
      q.append(el("code","","[x] · fatto:"+(DATI.oggi||"oggi")));
      q.append(" su "+(t.fonte||"la card")+".");
      conferma(art,q,async()=>{
        b.disabled=true;
        const r=await segnaFatto(t.progetto,t.indice,t.titolo);
        esito(art, r.ok?`fatto · riga ${r.riga} · ${r.fatto}`:`non scritto: ${r.errore||r.status}`, !!r.ok);
        b.disabled=false;
        setTimeout(carica, r.ok?400:1500);
      },{si:"segna fatto",ritorno:b});
    });
    az.append(b);
    if(card){ const a=el("a","btn quieto","card ↗"); a.href=card; az.append(a); }
  }else if(t.tipo==="bloccato"){
    az.append(bottone("Apri la card ↗", card));
  }else{
    az.append(bottone("Vedi il check ↗","/canvas#sistema"));
    if(card){ const a=el("a","btn quieto","card ↗"); a.href=card; az.append(a); }
  }
  art.append(az);
  return art;
}
function disegnaRichiedono(d){
  const box=$("ticket"); box.replaceChildren();
  const lista=(d.richiedono_te||[]).slice().sort(ordinaTicket);
  $("richiedono-n").textContent=lista.length?`${lista.length}`:"";
  if(!lista.length){
    const v=el("div","vuoto");
    const q=el("div","quadro"); q.append(el("i")); v.append(q);
    const p=el("p"); p.append(el("b","","Niente da fare."));
    const u=(d.numeri||{}).ultima_spunta;
    p.append(el("small","", u?`ultima spunta: ${fmtData(u)}`:"nessuna spunta registrata nelle card di quest'area"));
    v.append(p); box.append(v);
    return;
  }
  const l=el("div","ticket-list");
  lista.forEach((t,i)=>l.append(ticket(t,i)));
  box.append(l);
}

function tacche(chiusi, totali){
  const w=el("div","tacche");
  if(!totali){ w.append(el("span","n vuoto-t","nessun task")); return w; }
  const n=Math.min(12,totali), on=Math.round(chiusi/totali*n);
  const b=el("div","b"+(chiusi===totali?" pieno":""));
  for(let i=0;i<n;i++){ const s=el("i"); s.style.setProperty("--d",(i*35)+"ms"); if(i<on) s.dataset.on="1"; b.append(s); }
  w.append(b, el("span","n",`${chiusi}/${totali}`));
  return w;
}
function statoTask(t, oggi){
  const s=t.stato||"aperto";
  if(s==="fatto") return {cls:"", testo:"fatto"+(t.fatto_il?" · "+fmtData(t.fatto_il):"")};
  if(s==="verificato dal check") return {cls:"green", testo:"verificato dal check"};
  if(s==="riaperto dal check") return {cls:"red", testo:"riaperto dal check"};
  if(t.scad&&oggi&&t.scad<oggi) return {cls:"amber", testo:"scaduto il "+fmtData(t.scad)};
  if(t.scad) return {cls:"", testo:"scad "+fmtData(t.scad)};
  return {cls:"", testo:"aperto"};
}
function dettaglio(p, d){
  const box=el("div","dett");
  const checks={}; for(const c of (p.salute||{}).checks||[]) checks[c.check]=c;
  const lista=p.tasks||[];
  if(!lista.length){
    const s=el("div","senza"); s.append("Questa card non ha ancora un elenco "); s.append(el("code","","**Task:**"));
    s.append(" nel blocco STATO: qui compare la prossima azione dichiarata."); box.append(s);
  }
  for(const t of lista){
    const st=statoTask(t, d.oggi);
    const chiuso=t.stato==="fatto"||t.stato==="verificato dal check";
    const r=el("div","task"+(chiuso?" chiuso":""));
    const sp=el("button","spunta"+(t.stato==="riaperto dal check"?" riaperto":t.stato==="verificato dal check"?" verificato":""));
    sp.setAttribute("role","checkbox"); sp.setAttribute("aria-checked", t.spuntato?"true":"false");
    sp.setAttribute("aria-label",(t.spuntato?"fatto: ":"segna fatto: ")+t.testo);
    if(t.stato==="riaperto dal check"){ sp.setAttribute("aria-checked","mixed"); sp.title="spuntato, ma il check e' tornato rosso"; }
    if(t.stato==="verificato dal check") sp.title="il check e' verde: chiuso anche senza spunta";
    const puo=t.stato==="aperto";
    sp.disabled=!puo;
    if(puo) sp.addEventListener("click",()=>{
      const q=document.createDocumentFragment();
      q.append("Segnare fatto «"+t.testo+"»? Scrive ");
      q.append(el("code","","[x] · fatto:"+(d.oggi||"oggi")));
      q.append(" nella card "+p.id+" (riga "+t.riga+").");
      conferma(r,q,async()=>{
        sp.disabled=true;
        const e=await segnaFatto(p.id,t.indice,t.testo);
        esito(r, e.ok?`scritto · riga ${e.riga} · fatto:${e.fatto}`:`non scritto: ${e.errore||e.status}`, !!e.ok);
        if(!e.ok) sp.disabled=false; else sp.setAttribute("aria-checked","true");
        setTimeout(carica, e.ok?400:1500);
      },{si:"segna fatto",ritorno:sp});
    });
    r.append(sp);
    const tx=el("div","t",t.testo);
    const sm=el("small");
    if(t.owner) sm.append(el("span","",t.owner));
    for(const c of t.checks||[]){ const s=el("span"); s.append(el("i","led "+((checks[c]||{}).level||"sconosciuto")), " check:"+c); s.title=(checks[c]||{}).headline||"check assente dallo snapshot"; sm.append(s); }
    if(sm.childNodes.length) tx.append(sm);
    r.append(tx, el("span","st "+st.cls, st.testo));
    box.append(r);
  }
  const f=el("div","fondo");
  if(p.prossima_azione){ const s=el("span"); s.append(el("b","","prossima azione (STATO): "), taglia(p.prossima_azione,140)); f.append(s); }
  const t1=el("span"); t1.append(el("b","","ultimo tocco: "), p.ultimo_tocco?fmtData(p.ultimo_tocco)+(p.giorni_fermo!=null?` (${p.giorni_fermo} g)`:""):"—"); f.append(t1);
  const t2=el("span"); t2.append(el("b","","verifica: "), p.ultima_verifica?fmtData(p.ultima_verifica):"mai dichiarata"); f.append(t2);
  const a=el("a","btn quieto piccolo","apri la card ↗"); a.href=`/canvas#scheda=${encodeURIComponent(p.id)}`; f.append(a);
  box.append(f);
  return box;
}
function rigaProgetto(p, d){
  const r=el("div","riga"); r.dataset.id=p.id;
  r.dataset.salute=(p.salute||{}).livello||"nessuno";
  r.append(el("i","salute"));
  const capo=el("button","capo"); capo.setAttribute("aria-expanded",APERTE.has(p.id)?"true":"false");
  const nome=el("div","nome",p.titolo||p.id);
  nome.append(el("small","",p.id));
  const fase=el("span","fase "+(p.fase||""),p.fase||"senza fase");
  const goal=el("div","goal",p.goal||""); goal.title=p.goal||"";
  const tk=tacche(p.task_chiusi||0,p.task_totali||0);
  const pros=el("div","prossimo"+(p.prossimo_task?"":" nessuno"), p.prossimo_task||(p.task_totali?"tutti chiusi":"—"));
  pros.title=p.prossimo_task||"";
  capo.append(nome,fase,goal,tk,pros,chev());
  const lbl=el("span","vis-nascosto"," — apri i task"); nome.append(lbl);
  capo.addEventListener("click",()=>{
    const ap=r.classList.toggle("aperta");
    capo.setAttribute("aria-expanded",ap?"true":"false");
    if(ap){ APERTE.add(p.id); r.append(dettaglio(p,d)); }
    else { APERTE.delete(p.id); r.querySelector(".dett")?.remove(); }
  });
  r.append(capo);
  if(APERTE.has(p.id)){ r.classList.add("aperta"); r.append(dettaglio(p,d)); }
  return r;
}
function disegnaProgetti(d){
  const box=$("righe"); box.replaceChildren();
  const lista=d.progetti||[];
  $("progetti-n").textContent=lista.length?String(lista.length):"";
  $("progetti-nota").textContent=lista.length?"toccati negli ultimi 14 giorni":"";
  if(!lista.length){
    const v=el("div","vuoto");
    const q=el("div","quadro grigio"); q.append(el("i")); v.append(q);
    const p=el("p"); p.append(el("b","","Nessun progetto in quest'area."));
    const s=el("small"); s.append("Una card entra qui quando il suo blocco STATO dichiara "); s.append(el("code","","> **Area:** "+AREA));
    s.append(" ed e' stata toccata negli ultimi 14 giorni."); p.append(s); v.append(p); box.append(v);
    return;
  }
  for(const p of lista) box.append(rigaProgetto(p,d));
  /* le tacche si riempiono dopo il primo frame: e' l'unico momento orchestrato della pagina */
  const accendi=()=>box.querySelectorAll(".tacche i[data-on]").forEach(i=>i.classList.add("on"));
  if(PRIMA_VOLTA&&!RIDOTTO) requestAnimationFrame(()=>requestAnimationFrame(accendi)); else accendi();
}

function rigaPiega(k, t, sotto, p){
  const r=el("div","r");
  const k1=el("span","k1"); if(typeof k==="string") k1.textContent=k; else k1.append(k); r.append(k1);
  const t1=el("span","t1",t); if(sotto) t1.append(el("small","",sotto)); r.append(t1);
  r.append(el("span","p1",p||""));
  return r;
}
function disegnaPieghe(d){
  const inc=d.in_carico||[], oss=d.da_osservare||[];
  $("osserva-n").textContent=`${inc.length} in carico · ${oss.length} da osservare`;
  const c=$("osserva-corpo"); c.replaceChildren();
  const b1=el("div","blocco"); b1.append(el("h4","","In carico ad altri"));
  if(!inc.length) b1.append(el("div","nulla","Nessun check non verde e' assegnato a qualcun altro."));
  /* il livello del check lo conosce la salute dei progetti: in_carico porta solo l'id */
  const livelli={}; for(const p of d.progetti||[]) for(const c of (p.salute||{}).checks||[]) livelli[c.check]=c.level;
  for(const x of inc){
    const k=document.createDocumentFragment();
    const peggiore=(x.checks||[]).map(c=>livelli[c]||"sconosciuto").sort((a,b)=>({red:0,amber:1,unknown:2,sconosciuto:2}[a]??3)-({red:0,amber:1,unknown:2,sconosciuto:2}[b]??3))[0]||"sconosciuto";
    k.append(el("i","led "+peggiore));
    b1.append(rigaPiega(k, x.titolo, (x.checks||[]).map(c=>"check:"+c).join(" · "), x.owner||"—"));
  }
  const b2=el("div","blocco"); b2.append(el("h4","","Da osservare — ambra e non misurati, nessuno li chiede"));
  if(!oss.length) b2.append(el("div","nulla","Niente in ambra e niente non misurato fuori dai task."));
  for(const x of oss){
    const k=document.createDocumentFragment(); k.append(el("i","led "+x.level), " "+x.check);
    b2.append(rigaPiega(k, x.headline||"—", null, x.level));
  }
  c.append(b1,b2);

  const ar=d.archivio||{conteggio:0,elenco:[]};
  $("archivio-n").textContent=ar.conteggio?`${ar.conteggio} ${ar.conteggio===1?"progetto fermo":"progetti fermi"} da oltre 14 giorni o archiviati`:"vuoto";
  const a=$("archivio-corpo"); a.replaceChildren();
  const b3=el("div","blocco");
  if(!ar.elenco||!ar.elenco.length) b3.append(el("div","nulla","Nessuna card ferma: tutte quelle dell'area sono in principale."));
  for(const x of ar.elenco||[]){
    const r=rigaPiega(x.fase||"—", x.titolo, x.id, x.motivo||"");
    const link=el("a","","apri ↗"); link.href=`/canvas#scheda=${encodeURIComponent(x.id)}`; link.style.marginLeft="10px"; link.style.fontSize="11px";
    r.querySelector(".p1").append(link);
    b3.append(r);
  }
  a.append(b3);
}

function disegna(d){
  disegnaVerdetto(d);
  disegnaRichiedono(d);
  disegnaProgetti(d);
  disegnaPieghe(d);
  PRIMA_VOLTA=false;
  stamp();
}
function stamp(msg, ko){
  const s=$("stamp"); s.className="stamp"+(ko?" ko":"");
  s.replaceChildren();
  if(msg){ s.append(msg); return; }
  if(!RICEVUTO) return;
  const hm=String(RICEVUTO.getHours()).padStart(2,"0")+":"+String(RICEVUTO.getMinutes()).padStart(2,"0");
  s.append("aggiornato "); s.append(el("b","",hm)); s.append(" · ogni 60 s");
}

/* Stato di errore: esplicito, mai una pagina rotta. La banda si spegne
   (nessun colore di stato: non sappiamo), i dati vecchi restano marcati. */
function errore(msg){
  const banda=$("verdetto"), h1=$("titolo"), sotto=$("sotto");
  banda.dataset.livello="none"; banda.style.setProperty("--stato","var(--dim)");
  h1.replaceChildren(el("span","","Il cockpit non risponde"));
  sotto.replaceChildren();
  sotto.append(el("span","mono",`GET /api/cockpit?area=${AREA} → ${msg}`));
  sotto.append(" · riprovo fra 60 s");
  const b=el("button","btn piccolo","riprova"); b.addEventListener("click",carica); sotto.append(b);
  if(!DATI){
    $("numeri").replaceChildren();
    const v=el("div","vuoto"); const q=el("div","quadro grigio"); q.append(el("i")); v.append(q);
    const p=el("p"); p.append(el("b","","Nessun dato ricevuto.")); p.append(el("small","","il server della torre non ha risposto: e' vivo su questa porta?"));
    v.append(p); $("ticket").replaceChildren(v);
    $("righe").replaceChildren();
  }
  stamp(DATI&&RICEVUTO?`dati di ${etaS((Date.now()-RICEVUTO)/1000)} fa · ultimo tentativo fallito`:"nessun dato", true);
}

async function carica(){
  if(document.querySelector(".conferma")) return;   /* non ridisegnare sotto le dita */
  let r;
  try{ r=await fetch(`/api/cockpit?area=${encodeURIComponent(AREA)}`,{cache:"no-store"}); }
  catch(e){ errore(String(e)); return; }
  if(!r.ok){ let m=String(r.status); try{ m+=" "+((await r.json()).error||""); }catch(e){} errore(m.trim()); return; }
  let d; try{ d=await r.json(); }catch(e){ errore("risposta non JSON"); return; }
  DATI=d; RICEVUTO=new Date();
  disegna(d);
}

/* ═══════════════════════════════ testa, tasti, orologio ═══════════════════════════════ */
function disegnaAree(){
  const nav=$("aree"); nav.replaceChildren(el("span","eti","area"));
  for(const a of AREE){
    const b=el("button","area"+(a.id===AREA?" attiva":""),a.nome);
    b.setAttribute("aria-pressed",a.id===AREA?"true":"false");
    if(!a.attiva){ b.disabled=true; b.title="entra quando le sue card dichiarano Area:"; }
    else b.addEventListener("click",()=>{ if(AREA===a.id) return; AREA=a.id; location.hash="area="+a.id; PRIMA_VOLTA=true; APERTE.clear(); disegnaAree(); carica(); });
    nav.append(b);
  }
  const altre=el("button","area","+ altre aree"); altre.disabled=true;
  altre.title="Gli altri progetti Maven entrano qui quando le loro card dichiarano `Area:` e hanno check nello snapshot.";
  nav.append(altre);
  $("area-nome").textContent=(AREE.find(a=>a.id===AREA)||{}).nome||AREA;
}
function orologio(){
  const d=new Date();
  $("data").textContent=`${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
  $("orologio").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
  const k=e.key.toLowerCase();
  if(k==="r"){ e.preventDefault(); carica(); }
  else if(k==="e"){ e.preventDefault();
    const righe=[...document.querySelectorAll("#righe .riga")]; if(!righe.length) return;
    const tutteAperte=righe.every(r=>r.classList.contains("aperta"));
    righe.forEach(r=>{ if(r.classList.contains("aperta")===!tutteAperte) return; r.querySelector(".capo").click(); });
  }
  else if(k==="c"){ e.preventDefault(); location.href="/canvas"; }
});
addEventListener("hashchange",()=>{ const a=areaDaHash(); if(a!==AREA){ AREA=a; PRIMA_VOLTA=true; APERTE.clear(); disegnaAree(); carica(); } });

disegnaAree();
orologio(); setInterval(orologio,20000);
carica();
setInterval(carica,POLL_MS);
</script>
