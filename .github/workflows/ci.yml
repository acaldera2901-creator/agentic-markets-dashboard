# #TESTS-CI-0801 — la prima CI che esegue i test di questo repo.
#
# Prima di questo file .github/workflows/ conteneva SOLO supabase-migrations.yml,
# e vercel.json esegue `npm run build`: quindi 542 test vitest, 36 test standalone
# in tests/ e la suite pytest non venivano lanciati da niente in automatico. Una
# regressione passava se `next build` compilava — ed è esattamente così che tre
# test sono rimasti rossi per settimane senza che nessuno lo sapesse (dettagli nel
# commit di #TESTS-CI-0801).
#
# Cosa gira qui: gli step verificati verdi sul commit che li introduce.
#
# #MIGRATION-REPLAY-0801: aggiunto il job Python, che era dichiarato come "passo
# successivo" e ora è possibile — la suite era 1140 verdi e 1 rosso, e quel rosso
# non era flaky ma un difetto vero (il log di audit sovrascriveva una voce quando
# due audit cadevano nello stesso tick dell'orologio). Chiuso quello, pytest passa
# 1105/1105 e può stare a gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Le suite vitest: {app,lib,components,features}/**/*.test.{ts,tsx}
      - name: Vitest
        run: npm test

      # I test di tests/ NON sono suite vitest (nessuno importa da vitest): sono
      # script node:assert / node:test autonomi. Vanno eseguiti con un runner TS,
      # non aggiunti all'include di vitest — vedi scripts/run-standalone-tests.mjs.
      # I due che richiedono segreti vengono SALTATI con messaggio se le variabili
      # non ci sono: passa i secret qui sotto quando volete anche quelli a gate.
      - name: Test standalone (tests/)
        run: node scripts/run-standalone-tests.mjs
        env:
          CRM_UNSUB_SECRET: ${{ secrets.CRM_UNSUB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Runtime + dipendenze di test: vedi requirements-dev.txt per il perche'
      # della separazione (#CI-PYTHON-DEPS-0801).
      - run: pip install -r requirements-dev.txt

      # Gli agenti Python: modello, gate di surfacing, settlement, client dati.
      - name: Pytest
        run: python -m pytest -q

      # Le migration devono restare RI-ESEGUIBILI: il registro remoto e i file
      # locali hanno divergito una volta (#MIGRATION-DRIFT-0801) e la via di
      # riconciliazione passa dal ri-applicarle. Questo gate impedisce che una
      # migration nuova reintroduca uno statement che alla seconda esecuzione
      # erra o — peggio, perché silenzioso — riscrive dati di produzione.
      - name: Migration replay-safety
        run: python scripts/check_migrations_replayable.py
